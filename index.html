<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshi Minh - Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=3" sizes="any">
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/script.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <div class="ambient-glow" aria-hidden="true"></div>

      <header class="site-header" aria-label="Primary">
        <a class="brand" href="./">JM.</a>
        <nav id="social-links" class="social-links" aria-label="Social links"></nav>
      </header>

      <main>
        <section class="hero-section">
          <div class="hero-inner reveal is-visible">
            <div id="hero-badge" class="badge badge-outline hero-badge"></div>
            <h1 id="hero-title" class="hero-title text-gradient"></h1>
            <p id="hero-real-name" class="hero-real-name"></p>
            <p id="hero-copy" class="hero-copy"></p>
            <div class="hero-actions">
              <a class="button button-primary" href="#projects">View Projects</a>
              <a id="hero-github" class="button button-secondary" href="#" target="_blank" rel="noopener noreferrer">
                <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                <span>GitHub</span>
              </a>
            </div>

            <div class="terminal-card reveal is-visible">
              <div class="terminal-window">
                <div class="terminal-topbar">
                  <div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div>
                  <div class="terminal-title">~ / joshiminh / profile</div>
                </div>
                <div class="terminal-body">
                  <div class="terminal-command"><span class="prompt">&#10095;</span><span class="typing-animation">cat data/profile.json</span></div>
                  <div id="profile-output" class="terminal-output"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="projects" class="content-section bordered-section">
          <div class="section-heading reveal">
            <h2>Projects</h2>
            <p>Production applications and smaller interactive builds, grouped by category.</p>
          </div>
          <div id="projects-grid" class="project-groups"></div>
        </section>

        <section class="tech-section bordered-section">
          <div class="section-heading reveal centered">
            <h2>Technologies</h2>
            <p>The stack I use to build scalable, high-performance applications.</p>
          </div>
          <div id="tech-row" class="tech-row reveal"></div>
        </section>
      </main>

      <footer class="site-footer-bottom">
        <div class="footer-brand">JM.</div>
        <p>&copy; <span id="current-year">2026</span> Joshi Minh. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
